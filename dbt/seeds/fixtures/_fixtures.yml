version: 2

seeds:
  - name: trip_updates_snapshot
    description: >
      CI-only fixture standing in for the real raw.trip_updates_snapshot
      table (which is populated by ingestion/load_raw.py, not dbt, in
      dev/prod). Named to match the source table exactly so stg_trip_updates
      resolves against it when BQ_RAW_DATASET points at the ci dataset.
      Covers: a duplicate poll of the same stop (dedup), a null
      arrival_delay_seconds with a departure_delay_seconds fallback, an
      on-time and a late row, a route_id absent from the route seed (should
      be dropped by the mart's inner join), and a null trip_id (should be
      dropped by staging's not_null filter). Not run in dev/prod -- CI
      selects it explicitly by name rather than relying on a bare `dbt seed`.
    config:
      column_types:
        # Explicit, matching ingestion/bootstrap_bigquery.py's real schema --
        # left to auto-detection, BigQuery infers these timestamp-with-offset
        # strings as the timezone-naive DATETIME type instead of TIMESTAMP,
        # which then rejects the "+00:00" suffix and fails the whole load.
        poll_timestamp: TIMESTAMP
        feed_timestamp: TIMESTAMP
        stop_sequence: INT64
        arrival_delay_seconds: INT64
        departure_delay_seconds: INT64
