version: 2

seeds:
  - name: trip_updates_snapshot
    description: >
      CI-only fixture standing in for the real raw.trip_updates_snapshot
      table (which is populated by ingestion/load_raw.py, not dbt, in
      dev/prod). Named to match the source table exactly so stg_trip_updates
      resolves against it when BQ_RAW_DATASET points at the ci dataset.
      Route_ids (WST_1a, NSN_1a, IWL_1c) are real values from
      seed_sydney_trains_routes, not placeholders -- an earlier version of
      this fixture used invented route_ids that happened to match an
      earlier, wrong version of the seed, which let a real seed-data bug
      pass CI silently for several runs (see LEARNING_NOTES section 12).
      Covers: a duplicate poll of the same stop (dedup), a null
      arrival_delay_seconds with a departure_delay_seconds fallback, an
      on-time and a late row, a real out-of-scope route_id (CCN_1a, an NSW
      Trains regional line -- should be dropped by the mart's inner join),
      and a null trip_id (should be dropped by staging's not_null filter).
      Not run in dev/prod -- CI selects it explicitly by name rather than
      relying on a bare `dbt seed`.
    config:
      column_types:
        # Every column typed explicitly to match ingestion/bootstrap_bigquery.py's
        # real schema exactly, rather than trusting BigQuery's CSV
        # auto-detection column by column. Two columns already burned this:
        # poll_timestamp/feed_timestamp got inferred as DATETIME (rejecting
        # the "+00:00" offset), and start_date -- all-digit values like
        # "20260105" -- got inferred as INT64, breaking PARSE_DATE which
        # needs a STRING. Typing everything up front avoids finding the
        # next one the same way, one failed CI run at a time.
        trip_id: STRING
        route_id: STRING
        start_date: STRING
        stop_id: STRING
        stop_sequence: INT64
        arrival_delay_seconds: INT64
        departure_delay_seconds: INT64
        schedule_relationship: STRING
        poll_timestamp: TIMESTAMP
        feed_timestamp: TIMESTAMP
