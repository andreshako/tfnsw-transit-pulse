name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Write dbt profile
        run: cp dbt/profiles.yml.example dbt/profiles.yml

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      # --full-refresh: every CI run should be self-contained and
      # deterministic against the fixture data, not dependent on whatever
      # partitions a previous run happened to leave in the ci dataset.
      - name: dbt build against fixture data
        working-directory: dbt
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_LOCATION: australia-southeast1
          BQ_RAW_DATASET: ci
        run: >
          dbt build --target ci --full-refresh
          --select seed_sydney_trains_routes trip_updates_snapshot stg_trip_updates fct_line_otp_daily
